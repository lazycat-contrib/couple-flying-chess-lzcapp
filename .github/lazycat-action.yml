version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/couple-flying-chess.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: couple-flying-chess
    bump: patch
build:
  run_buildscript: false
images:
  - id: couple-flying-chess
    target: service
    service: couple-flying-chess
    source: czyt/couple-flying-chess
    channel: custom
    sort: created
    tag_regex: '^latest$'
    delivery:
      mode: lazycat
stores:
  official:
    enabled: true
    skip_if_version_exists: true
    changelog_locales: [zh, en]
  private:
    enabled: true
    skip_if_version_exists: true
    name: 情侣飞行棋
    summary: "情侣飞行棋"
